apiVersion: cdi.kubevirt.io/v1beta1
kind: DataSource
metadata:
  name: {{ .name }}
spec:
  source:
    {{ if .useSnapshot }}
    snapshot:
      name: {{ .snapshotName }}
      namespace: {{ .Namespace }}
    {{ else }}
    pvc:
      name: {{ .pvcName }}
      namespace: {{ .Namespace }}
    {{ end }}
